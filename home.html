    {
      title: 'how do i even make a resume?',
      date: 'march 27, 2026',
      body: `
		<p>Here's my general resume tips, and you can use this as a guideline for creating your own resume:</p>
		<ol>
			<li>Use a resume template!! There's a time and place for cool, flashy, design-centered resumes, but a SWE internship or job is not that place! The reality is that your resume will probably not be read by a person first. It will likely be screened by a machine before it reaches a recruiters eyes. With that in mind, it needs to pass both tests.</li>
			<ul>
				<li>Use a clean and simple format that's widely successful. My favorite is <a href="https://www.overleaf.com/latex/templates/jakes-resume/syzfjbzwjncs?gad_source=1&gad_campaignid=23369341867&gbraid=0AAAAAqfJXW6GmtvBZT0KbThgaQet8muop&gclid=CjwKCAjwwdbPBhBgEiwAxBRA4a5YebPvPcDgG2i24XvTJCa6P0H8yYH48DuFeS8L2HLxMYC9kBz_8xoC07wQAvD_BwE">Jake's Resume template</a> in Overleaf.</li>
				<li>Use LaTeX to construct your resume! It's more precise than Google Docs or Word, and it's the best for getting parsed accurately by ATS-systems. Overleaf uses LaTeX, and is beginner friendly!</li>
			</ul>
			<li>Include your graduation information, especially for internships!! Many internships have grad year requirements, and not including it can get your resume automatically tossed.</li>
			<li>At the end, read through your resume as if a recruiter were reading it. You can use AI to help you create your resume, but at the end of the day, a real person will see it! Do the sentences make sense? Is the formatting easier to follow? Is important information (name, school, graduation year, previous experience) easy to find? You have less than 30 seconds to impress a recruiter! Make it easy for them to say YES!</li>
		</ol>
		<p>Now, a less popular, but super important topic. How do I make a resume if I don't have any relevant experience, but in order to get experience, I need to apply with a resume?</p>
		<p>I get it. I've been there. This chicken and egg problem is the reason I put off recruiting until my sophomore year, when most of my friends started their freshman year.</p>
		<p>How can I make a competitive resume when I don't have any experience yet?</p>
		<p>I remember I would feel embarrassed when friends asked to see my resume freshman year because honestly, there wasn't really anything on it. For the better half of freshman year, my honest answer was that I didn't have a resume. And, as I reasoned, because I didn't even have a resume, there was no way I could apply to internships for the following summer.</p>
		<p>But the thing is, you DO have relevant experience. It just might not be an internship, or a part-time software engineering role. It could be from a club you're involved in, or a project you worked on in class, or something you built outside of class. It exists, you just have to find a way to frame it.</p>
		<p>I worked a part-time job through high school. I also joined an on campus club as a marketing coordinator. I included both on my resume. It might not be software engineering, but it showed that I could work on a team, and overcome challenges.</p>
		<p>I built a required final project for a class that I was really proud of. I included that on my resume. It might not be a real job, but it's a real project that I had actually built. It doesn't have to be huge. I put a food blog that I'd created on my resume because I'd built it using HTML and CSS in class, and those could almost be programming languages.</p>
		<p>TLDR: If you do something, you can put it on your resume. It doesn't matter if it doesn't feel impressive, or you didn't spend that much time on it, or if it was required for a class. Something is better than nothing.</p>
	  `
    },
    {
      title: 'where do i apply to jobs?',
      date: 'april 5, 2026',
      body: `
		<p>You have the resume. Hopefully your resume is good enough. What I mean is that hopefully it is properly formatted, has (at least some) relevant information, and is ready to be fed to the wolves (recruiters and hiring managers). But how do you actually get your resume out there?</p>
		<p>There's a couple of avenues I've seen most people take here. I personally have relied mostly on just cold applying, but I've had friends who've gotten referrals or reached out via email directly to smaller companies to ask for roles. This is all to say that you have lots of options if you're looking for a job, but I'll talk mostly about cold applying, since that's what I've done the most.</p>
		<p>Here's my tips:</p>
		<ol>
			<li>Apply every single day. I've been told one of the best ways to get your resume to be seen is to be super early in submitting your application. If companies have way too much interest in a role, they may close the job listing early before you've even had a chance to apply. So check for roles and apply every single day.</li>
			<ul>
				<li>You could set up job alerts if there's a specific company you're wanting to work for. Otherwise, I found a combination of scrolling on LinkedIn Jobs, Handshake, and the Github repository for SWE internships the most helpful. I'll link the repo <a href="https://github.com/vanshb03/Summer2027-Internships">here</a>.</li>
			</ul>
			<li>Don't think you have to have all qualifications or skills in order to apply. If you think some of your experience aligns with the role, just apply! Have the audacity!</li>
			<ul>
				<li>This is a trap I fell into that set habits I'm still trying to break. Don't close a door before you even know if it'll open. I mean, don't count yourself out without even applying.</li>
				<li>You can apply and either get rejected or maybe get an interview, or not apply at all and definitely 100% get rejected. Give yourself a shot!</li>
			</ul>
			<li>Have different versions of your resume that you can swap out for different types of roles! Alternatively, you can tailor your resume to each role based on the keywords in the job description, but I found that the work to payoff ratio of tailoring your resume for every single application wasn't worth it, especially if you're doing it manually. And if you're having AI do it, you run the risk of AI misrepresenting your skills, which will hurt you in interviews when you're asked to walk through your resume in detail. You might forget which resume you've submitted!</li>
			<ul>
				<li>Instead, have resumes that are focused and tailored, but for role titles not job descriptions. I personally had a mobile focused resume, where I listed skills and experience catered towards mobile app development roles and a general software engineering resume that had skills and experience from full stack development. Based on the job description, I would choose one or the other to submit.</li>
			</ul>
			<li>Just keep applying! It only takes one YES to make hundreds of no's and rejections pay off. It's a numbers game, and you're applying to entry-level roles! The competition is intense, but that doesn't mean you won't succeed.</li>
		</ol>
		<p>Applying is the hardest part of the process! It's probably what you'll spend most of your time doing (for entry-level roles at least)! Give yourself grace, and be patient! What's important is to stay consistent, and probably also get used to getting rejected… a lot.</p>
		<p>TLDR: Don't count yourself out and just apply, a LOT.</p>
	  `
    },
    {
      title: 'help!! i am going to fail my interview!',
      date: 'april 17, 2026',
      body: `
		<p>Some general advice:</p>
		<ol>
			<li>Say yes!</li>
			<ul>
				<li>First, if you don't have a role lined up yet, say yes to the interview (obviously)! Again, you have to give yourself a chance, even if you think you'll fail the interview, or you don't have enough time to prepare, or you're too busy studying for finals to do an interview. Say YES!</li>
				<li>Second, even if you have a role lined up, still say yes! Take the time to learn more about the company you're interviewing with. Maybe you'll end up interviewing with them again in the future, and the time you spent interviewing now and getting reps in will pay off! This one can be a bit controversial, since you already have a role, but you should take every opportunity you can to practice interviewing. It's a skill that you either need to build, or need to relearn when you get rusty! You don't want to be caught off guard if your dream company schedules an interview with you, and you haven't done a proper interview in months. (Take it from me as I learned this the hard way)</li>
			</ul>
			<li>Don't cheat using AI tools. Not only is it incredibly easy to get caught, but you risk ruining the interview and your profile might even get flagged, preventing you from interviewing with that company in the future.</li>
			<ul>
				<li>Be genuinely yourself during the interview! It's fine to have notes, or to have questions written down that you don't want to forget, but be honest in your interviews! Your interviewers will appreciate it, and you'll probably enjoy it more too!</li>
				<li>Also, how will you improve your interviewing skills if you use AI as a crutch? What happens when you need to attend an in-person or on-site interview? Set yourself up for success early.</li>
			</ul>
		</ol>
		<p>Technical interview advice:</p>
		<ol>
			<li>If you didn't know the usual way to prepare for technical interviews, it's to do a couple of problems on LeetCode, or another competitive programming site. I personally liked the LeetCode 75, since that covered a lot of topics that interviewers might ask you about, and it has community solutions and explanations. It seems to be the most popular interview prep resource.</li>
			<ul>
				<li>Keep in mind that interviewers want to see how you think, not just what you type. Practice talking out loud as you code and think through your solution, to get better at narrating your thinking while coding.</li>
				<li>It's okay if your solution isn't an optimal solution, or the fastest one! Just write a solution first, then optimize your solution after you've already come up with one that works!</li>
			</ul>
			<li>Ask questions! A lot of the time, your interviewer will leave out specific information that will help you solve the problem, expecting that you will ask for it. Take advantage of that! They are there to help you succeed. Before you write a single line of code, ask clarifying questions about what you are being asked to do.</li>
		</ol>
		<p>Behavioral interview advice:</p>
		<ol>
			<li>Practice your elevator pitch until it's perfect. Every single interview starts with “tell me about yourself” and you want to nail this one because it starts off the interview on a good note.</li>
			<ul>
				<li>My personal favorite order to go in is repeating my name, school, year, and major. Then I talk about previous internships/projects I've done and what I'm currently working on. I saw one sentence about what I'm looking for in my next role (the usual answer is I'm looking to work collaboratively on a cool team with talented people) and end with what I'm involved in at school and my hobbies. This usually takes under 45 seconds to share.</li>
			</ul>
			<li>Prepare beforehand! Everyone likes to focus on the technical interview, but the behavioral interview is just as important (otherwise they wouldn't have you go through it). They're looking for a good fit for their team, so make sure to research their core values and come prepared with questions specific to your role!</li>
			<ul>
				<li>You can prepare a few stories from your experiences that could be broadly applied to most questions they'll ask you, just so you're not left scrambling if they throw you a curveball.</li>
			</ul>
			<li>Take a moment to think about what to say before you respond! Yes, you should've already prepared a bit beforehand, but you'll inevitably be asked new questions you hadn't thought about before. It's okay to take a minute or two to think of an answer before sharing with your interviewer!</li>
		</ol>
		<p>TLDR: Prep a little! Be yourself! But don't underestimate the behavioral interview!</p>
	  `
    },
